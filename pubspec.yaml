name: deutsch_pfad
description: Tägliches Deutsch für den Alltag, mit Weg zu B1 und B2.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  flutter_tts: ^4.0.2
  google_fonts: ^6.2.1
  # Letzte 1.x Version, nur dort funktioniert espeak-ng-data (dataDir) für Piper Stimmen
  sherpa_onnx: 1.12.40
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  archive: ^3.6.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#123524"
  adaptive_icon_foreground: assets/icon/icon_vordergrund.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/inhalt/
    - assets/stimme/
