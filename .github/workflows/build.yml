name: Android APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Secrets prüfen
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name fehlt (Settings, Secrets and variables, Actions)"
              exit 1
            fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Plattformordner sind nicht im Repo, deshalb hier erzeugen
      - name: Android Projekt erzeugen
        run: |
          flutter create --platforms=android --project-name deutsch_pfad --org com.deutschpfad .
          rm -f test/widget_test.dart

      # App Name, INTERNET für google_fonts, TTS_SERVICE für flutter_tts (Android 11+)
      - name: Manifest anpassen
        run: |
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          internet = '<uses-permission android:name="android.permission.INTERNET"/>'
          queries = ('<queries><intent><action android:name="android.intent.action.TTS_SERVICE"/>'
                     '</intent></queries>')
          s = re.sub(r'android:label="[^"]*"', 'android:label="Umlaut"', s, count=1)
          if internet not in s:
              s = s.replace("<application", internet + "\n    <application", 1)
          if "TTS_SERVICE" not in s:
              s = s.replace("</manifest>", "    " + queries + "\n</manifest>", 1)
          p.write_text(s, encoding="utf-8")
          PY

      - run: flutter pub get

      - name: App Icon erzeugen
        run: dart run flutter_launcher_icons

      - run: flutter test

      - run: flutter build apk --release --build-number=${{ github.run_number }}

      # Mit dem eigenen Keystore signieren (ersetzt die Debug Signatur)
      - name: APK signieren
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          mkdir -p dist
          KS_PASS="$KEYSTORE_PASSWORD" KEY_PASS="$KEY_PASSWORD" \
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out dist/umlaut.apk \
            build/app/outputs/flutter-apk/app-release.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs dist/umlaut.apk
          rm -f "$KEYSTORE"

      - uses: actions/upload-artifact@v4
        with:
          name: umlaut-apk
          path: dist/umlaut.apk
